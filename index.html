<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jellyfish Drift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html {
  height: 100%;
  height: -webkit-fill-available;
  background: #050d14;
}
body {
  height: 100%;
  height: -webkit-fill-available;
  overflow: hidden;
  background: linear-gradient(180deg, #0a1f2e 0%, #0d2d42 30%, #0f3a52 60%, #123f5a 100%);
  background-attachment: fixed;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
  max-width: 1440px;
  margin: 0 auto;
  box-shadow: 0 0 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(100,180,220,0.06);
  transform: translateZ(0);
}
@supports (-webkit-touch-callout: none) {
  /* iOS Safari: background-attachment: fixed is broken, use a pseudo-element instead */
  body {
    background: none;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: linear-gradient(180deg, #0a1f2e 0%, #0d2d42 30%, #0f3a52 60%, #123f5a 100%);
    z-index: -1;
    pointer-events: none;
  }
}

#toolbar {
  flex-shrink: 0;
  min-height: 44px;
  background: rgba(10, 25, 40, 0.72);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  padding: 6px 20px;
  gap: 8px;
  border-bottom: 1px solid rgba(100, 180, 220, 0.15);
  z-index: 10;
}
.t-label {
  color: #a8d8ea;
  font-size: 11px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  margin-right: 4px;
  font-weight: 600;
  white-space: nowrap;
}
button {
  background: none;
  border: 1px solid rgba(168, 216, 234, 0.4);
  color: #a8d8ea;
  padding: 4px 14px;
  font: 12px system-ui, -apple-system, sans-serif;
  cursor: pointer;
  letter-spacing: 0.04em;
  border-radius: 12px;
  transition: border-color 0.15s, color 0.15s, background 0.15s;
  white-space: nowrap;
}
button:hover { border-color: #a8d8ea; background: rgba(168, 216, 234, 0.12); color: #d6eef7; }
button.active { background: rgba(168, 216, 234, 0.18); color: #d6eef7; border-color: #a8d8ea; }

#draw-toolbar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(10, 25, 40, 0.82);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid rgba(100, 180, 220, 0.18);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding: 10px 20px;
  z-index: 20;
  transform: translateY(100%);
  transition: transform 0.22s cubic-bezier(0.4,0,0.2,1);
}
#draw-toolbar.visible {
  transform: translateY(0);
}

.nav-btn {
  display: flex;
  align-items: center;
  gap: 6px;
}
.nav-btn svg {
  flex-shrink: 0;
}

.t-sep {
  width: 1px;
  height: 20px;
  background: rgba(168, 216, 234, 0.25);
  flex-shrink: 0;
  margin: 0 2px;
}

.clr-btn {
  width: 20px; height: 20px;
  border-radius: 50%;
  border: 2px solid transparent;
  padding: 0;
  cursor: pointer;
  background: var(--c);
  flex-shrink: 0;
  transition: border-color 0.12s, transform 0.1s;
  outline: none;
}
.clr-btn:hover { transform: scale(1.18); }
.clr-btn.active { background: var(--c); border-color: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,0.4); }

.t-hint {
  color: #a8d8ea;
  opacity: 0.6;
  font-size: 11px;
  letter-spacing: 0.04em;
  margin-left: 4px;
  white-space: nowrap;
}

@media (max-width: 480px) {
  .t-hint { display: none; }
  #toolbar { padding: 6px 12px; gap: 6px; }
  button { padding: 4px 10px; }
  /* Scale draggable jellyfish down on mobile */
  .sh svg { transform: scale(0.55); transform-origin: top left; }
  .sh { width: 99px !important; height: 198px !important; }
}

#stage {
  flex: 1;
  min-height: 0;
  position: relative;
  display: flex;
  justify-content: center;
  overflow: hidden;
}

#wrap {
  position: relative;
  width: 100%;
  max-width: 1400px;
  margin: 0 auto;
}

canvas {
  display: block;
  position: absolute;
  top: 0; left: 0;
}
#tc { z-index: 1; }
#dc { z-index: 3; pointer-events: none; }
#dc.draw { pointer-events: all; cursor: crosshair; }

#sl {
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 2;
}

/* wrap creates its own stacking context so its children (canvases, #sl) sit above fixed jellies */
#wrap {
  position: relative;
  z-index: 2;
}

.sh {
  position: fixed;
  pointer-events: none;
  user-select: none;
  transition: filter 0.1s;
  width: fit-content;
  height: fit-content;
  z-index: 1;
}
.sh svg {
  pointer-events: none;
}
.sh .jbell, .sh .jibell, .sh .jarm, .sh .jtent {
  pointer-events: visiblePainted;
  cursor: grab;
}
.sh .jelly-hit {
  pointer-events: fill;
  cursor: grab;
}
.sh.drag .jbell, .sh.drag .jibell, .sh.drag .jarm, .sh.drag .jtent, .sh.drag .jelly-hit {
  cursor: grabbing;
}
.sh       { filter: drop-shadow(0 0 14px rgba(60,180,240,0.75)) drop-shadow(0 0 40px rgba(40,140,220,0.5)) drop-shadow(0 0 70px rgba(30,110,200,0.3)); }
.sh:hover { filter: drop-shadow(0 0 20px rgba(100,210,255,1)) drop-shadow(0 0 55px rgba(60,180,240,0.75)) drop-shadow(0 0 90px rgba(40,150,220,0.55)); }
.sh.drag  { filter: drop-shadow(0 4px 22px rgba(80,200,255,1)) drop-shadow(0 0 60px rgba(50,170,240,0.8)) drop-shadow(0 0 100px rgba(30,140,210,0.6)); }

/* jellyfish float layers */
#jelly-layer {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.jelly {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}

@keyframes jellyFade {
  0%   { opacity: 0; }
  8%   { opacity: var(--max-opacity); }
  85%  { opacity: var(--max-opacity); }
  100% { opacity: 0; }
}

@keyframes jellyDrift {
  0%   { left: var(--x0); top: var(--y0); }
  25%  { left: var(--x1); top: var(--y1); }
  50%  { left: var(--x2); top: var(--y2); }
  75%  { left: var(--x3); top: var(--y3); }
  100% { left: var(--x4); top: var(--y4); }
}

/* svg jellyfish styles (used both in draggable .sh and ambient #jelly-layer) */
.jbell { fill:url(#jgrad-bell); stroke:rgba(255,255,255,0.55); stroke-width:1.4 }
.jibell { fill:url(#jgrad-ibell); opacity:1 }
.jcrease { fill:none; stroke:rgba(255,255,255,0.18); stroke-width:0.8 }
.jarm { fill:url(#jgrad-arm); stroke:url(#jgrad-stroke-arm); stroke-width:0.8 }
.jtent { fill:none; stroke:url(#jgrad-stroke-tent); stroke-linecap:round }
.jhighlight { fill:none; stroke:#FDFCF9; stroke-width:2; opacity:0.55 }

</style>
</head>
<body>

<!-- shared SVG gradient defs for jellyfish, referenced via url(#id) -->
<svg xmlns="http://www.w3.org/2000/svg" width="0" height="0" style="position:absolute">
  <defs>
    <!-- bell dome: radial, fades from centre-bottom outward -->
    <radialGradient id="jgrad-bell" cx="50%" cy="62%" r="62%" fx="50%" fy="62%">
      <stop offset="0%"   stop-color="rgba(49,121,166,0.32)"/>
      <stop offset="55%"  stop-color="rgba(49,121,166,0.18)"/>
      <stop offset="100%" stop-color="rgba(49,121,166,0.04)"/>
    </radialGradient>
    <!-- inner bell: subtle top-to-bottom wash -->
    <linearGradient id="jgrad-ibell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(49,121,166,0.18)"/>
      <stop offset="100%" stop-color="rgba(49,121,166,0)"/>
    </linearGradient>
    <!-- arms / oral tentacles: strong at top, fades out -->
    <linearGradient id="jgrad-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(49,121,166,0.55)"/>
      <stop offset="100%" stop-color="rgba(49,121,166,0.05)"/>
    </linearGradient>
    <!-- stroke gradient for arms: white at top, dissolves to nothing -->
    <linearGradient id="jgrad-stroke-arm" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.75)"/>
      <stop offset="55%"  stop-color="rgba(255,255,255,0.3)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
    <!-- stroke gradient for tentacles: soft white at root, fully transparent at tip -->
    <linearGradient id="jgrad-stroke-tent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="rgba(255,255,255,0.6)"/>
      <stop offset="40%"  stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>
</svg>

    <svg id="icon-sound" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
      <line x1="23" y1="9" x2="17" y2="15"></line>
      <line x1="17" y1="9" x2="23" y2="15"></line>
    </svg>
    Sound
  </button>
  <button id="btn-draw-toggle" class="nav-btn" title="Toggle draw mode">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 20h9"></path>
      <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"></path>
    </svg>
    Draw
  </button>
</div>

  <button class="clr-btn"        data-color="#F5E6A3" style="--c:#F5E6A3" title="Buttermilk"></button>
  <button class="clr-btn"        data-color="#FFFFFF" style="--c:#FFFFFF" title="White"></button>
  <span class="t-sep"></span>
  <button id="btn-clear">Clear</button>
</div>

<script>
(function () {

  // ─── elements ─────────────────────────────────────────────────────────────
  const wrap  = document.getElementById('wrap');
  const tc    = document.getElementById('tc');
  const dc    = document.getElementById('dc');
  const tCtx  = tc.getContext('2d');
  const dCtx  = dc.getContext('2d');
  const shEls = Array.from(document.querySelectorAll('.sh'));

  // ─── constants ────────────────────────────────────────────────────────────
  const isMobile = window.innerWidth <= 480;
  const FS   = isMobile ? 11 : 14;   // font size px
  const LH   = isMobile ? 20 : 28;   // line height px
  const FONT       = `${FS}px Georgia, "Times New Roman", serif`;
  const TITLE_FONT = `italic 300 ${isMobile ? 26 : 42}px "Cormorant Garamond", Georgia, serif`;
  const PAD  = 18;   // clearance around shapes
  const SPAD = 5;    // clearance around drawn strokes
  const TITLE_H = isMobile ? 44 : 68; // space reserved for title above body text
  const CT   = (isMobile ? 40 : 62) + TITLE_H;   // column top (below title)
  // W, CL1, CR1 are dynamic — updated on each resize
  let W = wrap.offsetWidth || window.innerWidth;
  let CL1 = 48, CR1 = W - 48;

  // ─── text ─────────────────────────────────────────────────────────────────
const TEXT = `Underwater, movement is not a command but a conversation. The current bends around every shape, softening direction, turning distance into rhythm. Light arrives broken and blue, scattered across the surface before sinking slowly into silence. Everything is suspended, but nothing is still. The sea keeps breathing in long invisible gestures, folding the world into layers of shadow, glow, and quiet motion. A jellyfish moves through this floating architecture with no urgency to explain itself. Its form is almost weightless, almost transparent, a pulse of softness in the middle of the dark. The bell opens and closes with the calm of a thought that has not yet become language. Each tentacle follows the water’s invisible grammar, writing lines that disappear as soon as they are made. Nothing is written permanently here. The ocean keeps every gesture only for a moment, then releases it. There is a strange intelligence in drifting. Not the kind that demands a destination, but the kind that understands pressure, resistance, rhythm, and release. The jellyfish does not push against the ocean. It listens to it. It lets the current translate its body into motion. It becomes less an object moving through space and more a quiet agreement between form and force. Its softness is not weakness. It is a method of survival, a way of moving through uncertainty without breaking against it. Around it, the water changes constantly. Tiny particles rise and fall like dust in a room of blue light. Shadows stretch and loosen. Distant shapes appear for a moment, then dissolve back into depth. The surface above is only a memory of brightness, trembling far away. Below, the sea gathers its darker colors, soft and endless, like velvet moving slowly in the dark. Every layer holds another layer. Every silence carries another sound too low to be heard. Nothing here needs a straight line. Paths curve, collapse, return, and vanish. The body learns to navigate without certainty. The eye follows one thread, then another, then loses both to the tide. What seems fragile becomes persistent. What seems passive becomes precise. The jellyfish keeps moving, not because it knows where to go, but because the water keeps offering a way. It does not resist the detour. It becomes fluent in detour. To drift is not to be lost. It is to belong to a system larger than intention. It is to let the world pass through you without becoming less yourself. It is to accept that some forms of progress are soft, circular, almost invisible. The ocean does not ask for arrival. It asks for attention. It asks for the patience to feel where motion begins before it becomes visible. There are no sharp borders in this blue distance. Only gradients, pulses, echoes, and the slow exchange between body and tide. The jellyfish carries its own small atmosphere, a translucent shelter of movement and light. It passes through the water like a question that does not need to be answered. Around it, the sea rearranges itself again and again, never exactly the same, never entirely unfamiliar. Sometimes the current gathers strength, and everything leans in one direction. Sometimes it loosens, and the world seems to pause. But even the pause is moving. Even stillness has a current underneath it. The jellyfish rises, falls, turns, and opens, repeating a rhythm older than language. It does not perform effort. It reveals it differently. It makes motion look like listening. In the dark, its body becomes almost a lantern. Not bright enough to conquer the water, just bright enough to be present inside it. A small glow, a small pulse, a soft interruption in the depth. The tentacles trail behind like unfinished sentences, delicate and patient, touching nothing and everything at once. They do not draw a map. They draw the feeling of almost knowing where you are. And maybe that is the lesson hidden in the water: that not every journey needs to announce itself. Some things move by yielding. Some things endure by remaining open. Some things find their way through contact, through sensitivity, through the quiet reading of forces too subtle to name. The jellyfish does not master the ocean. It belongs to it, and in belonging, it moves. So it floats through the blue, neither lost nor waiting, neither passive nor certain. A body made of breath, a gesture made of water, a soft intelligence suspended in the dark. Around it, the sea continues its endless work of folding, carrying, dissolving, and returning. And for a moment, everything feels held: the light, the silence, the invisible path, the delicate shape moving through it.`;

  // ─── word measurement ─────────────────────────────────────────────────────
  const mCtx = document.createElement('canvas').getContext('2d');
  mCtx.font  = FONT;
  const SPW  = mCtx.measureText(' ').width;
  const words = TEXT.split(/\s+/).filter(Boolean);
  const wW    = words.map(w => mCtx.measureText(w).width);

  let H;

  // ─── measure total height needed to fit all text ──────────────────────────
  function measureFullHeight(obs) {
    const cols = [[CL1, CR1]];
    let wi = 0;
    let totalLines = 0;

    for (const [L, R] of cols) {
      let y = CT;
      while (wi < words.length) {
        const ss       = segsForLine(y, L, R, obs);
        const wiBefore = wi;
        for (const [sL, sR] of ss) {
          if (wi >= words.length) break;
          const sw = sR - sL;
          let lineW = 0;
          while (wi < words.length) {
            const ww     = wW[wi];
            const needed = lineW === 0 ? ww : lineW + SPW + ww;
            if (needed > sw + 0.5) break;
            lineW = needed;
            wi++;
          }
        }
        if (wi === wiBefore && wi < words.length && wW[wi] > R - L) wi++;
        y += LH;
        totalLines++;
        if (wi >= words.length) { y += LH; break; }
      }
      if (wi >= words.length) break;
    }
    return CT + totalLines * LH + 52;
  }

  // ─── resize ───────────────────────────────────────────────────────────────
  const DPR = window.devicePixelRatio || 1;

  function setCanvasSize(canvas, w, h) {
    canvas.width  = w * DPR;
    canvas.height = h * DPR;
    canvas.style.width  = w + 'px';
    canvas.style.height = h + 'px';
  }

  let prevW = 0;

  function resize() {
    const newW = wrap.offsetWidth || window.innerWidth;
    if (prevW && prevW !== newW) {
      // scale shape positions proportionally to new width
      const ratio = newW / prevW;
      shEls.forEach(el => {
        el.style.left = (el.offsetLeft * ratio) + 'px';
        el.style.top  = (el.offsetTop  * ratio) + 'px';
      });
    }
    W    = newW;
    CL1  = Math.round(Math.min(W * 0.055, 72));
    CR1  = W - CL1;
    prevW = W;

    const toolbarH = document.getElementById('toolbar').offsetHeight;
    H = Math.max(window.innerHeight - toolbarH, measureFullHeight(getObstacles()));
    wrap.style.height = H + 'px';

    // Re-scale drift amplitude and clamp positions to new canvas size
    if (typeof swimmers !== 'undefined') {
      swimmers.forEach(sw => {
        sw.driftAmp  = window.innerWidth  * (0.35 + Math.random() * 0.20);
        sw.vDriftAmp = window.innerHeight * (0.30 + Math.random() * 0.20);
        sw.x = Math.min(sw.x, window.innerWidth  - sw.elW - 20);
        sw.y = Math.min(sw.y, window.innerHeight - sw.elH - 20);
      });
    }
    setCanvasSize(tc, W, H);
    setCanvasSize(dc, W, H);
    tCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    dCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
    redrawStrokes();
    render();
  }

  // ─── tight stroke obstacles (per-row horizontal slabs) ────────────────────
  // Instead of one big bounding box, compute a thin slab per LH row so text
  // hugs the actual shape of the drawn stroke.
  function strokeToObs(pts) {
    if (!pts || pts.length < 1) return [];
    if (pts.length === 1) {
      return [{ x: pts[0][0] - SPAD, y: pts[0][1] - SPAD, w: SPAD * 2, h: SPAD * 2 }];
    }
    const p = SPAD;
    let minY = Infinity, maxY = -Infinity;
    for (const [, y] of pts) { if (y < minY) minY = y; if (y > maxY) maxY = y; }

    const obs = [];
    const rowStart = Math.floor((minY - p) / LH) * LH;
    const rowEnd   = maxY + p + LH;

    for (let ry = rowStart; ry <= rowEnd; ry += LH) {
      const bTop = ry - p;
      const bBot = ry + LH + p;
      let lx = Infinity, rx = -Infinity;

      for (let i = 0; i < pts.length; i++) {
        const [x, y] = pts[i];
        if (y >= bTop && y <= bBot) {
          if (x < lx) lx = x;
          if (x > rx) rx = x;
        }
        // catch segments that cross the band without landing a point inside it
        if (i > 0) {
          const [px, py] = pts[i - 1];
          const segMin = Math.min(py, y);
          const segMax = Math.max(py, y);
          if (segMin < bBot && segMax > bTop) {
            if (x  < lx) lx = x;  if (x  > rx) rx = x;
            if (px < lx) lx = px; if (px > rx) rx = px;
          }
        }
      }

      if (lx <= rx) {
        obs.push({ x: lx - p, y: ry, w: (rx - lx) + p * 2, h: LH });
      }
    }
    return obs;
  }

  // ─── per-row shape obstacles ──────────────────────────────────────────────
  // Sample the bell path outline at many points using getPointAtLength, then
  // for each text-row band find the true left/right pixel extents.
  // This makes text hug the actual bell curve on both sides.
  function shapeToObs(el) {
    const bellPath = el.querySelector('.jbell');
    if (!bellPath) {
      const fb = el.getBoundingClientRect();
      const wr = wrap.getBoundingClientRect();
      return [{
        x: (fb.left - wr.left) - PAD,
        y: (fb.top  - wr.top)  - PAD,
        w: fb.width  + PAD * 2,
        h: fb.height + PAD * 2,
      }];
    }

    const svg  = el.querySelector('svg');
    const svgW = parseFloat(svg.getAttribute('width'))  || el.offsetWidth;
    const svgH = parseFloat(svg.getAttribute('height')) || el.offsetHeight;
    const elRect  = el.getBoundingClientRect();
    const wrapRect = wrap.getBoundingClientRect();
    const elX  = elRect.left - wrapRect.left;
    const elY  = elRect.top  - wrapRect.top;
    // SVG viewBox is "0 0 360 720", element is e.g. 180×360 → scale 0.5
    const scaleX = svgW / 360;
    const scaleY = svgH / 720;

    // Sample the bell outline in viewBox space
    const total  = bellPath.getTotalLength();
    const STEPS  = 120;
    // [y_px, lx_px, rx_px] per row band, keyed by row
    const rowMap = new Map();

    for (let i = 0; i <= STEPS; i++) {
      const pt = bellPath.getPointAtLength((i / STEPS) * total);
      const xPx = elX + pt.x * scaleX;
      const yPx = elY + pt.y * scaleY;
      const ry  = Math.floor(yPx / LH) * LH;
      const cur = rowMap.get(ry) || [Infinity, -Infinity];
      if (xPx < cur[0]) cur[0] = xPx;
      if (xPx > cur[1]) cur[1] = xPx;
      rowMap.set(ry, cur);
    }

    // Sample tentacles and arms per row the same way as the bell
    const tentPaths = Array.from(el.querySelectorAll('.jtent, .jarm'));
    for (const path of tentPaths) {
      const tTotal = path.getTotalLength();
      if (tTotal === 0) continue;
      const tSteps = Math.max(60, Math.round(tTotal / 4));
      for (let i = 0; i <= tSteps; i++) {
        const pt  = path.getPointAtLength((i / tSteps) * tTotal);
        const xPx = elX + pt.x * scaleX;
        const yPx = elY + pt.y * scaleY;
        const ry  = Math.floor(yPx / LH) * LH;
        const cur = rowMap.get(ry) || [Infinity, -Infinity];
        if (xPx < cur[0]) cur[0] = xPx;
        if (xPx > cur[1]) cur[1] = xPx;
        rowMap.set(ry, cur);
      }
    }

    const obs = [];
    rowMap.forEach(([lx, rx], ry) => {
      if (lx <= rx) {
        obs.push({ x: lx - PAD, y: ry, w: (rx - lx) + PAD * 2, h: LH });
      }
    });

    return obs;
  }

  // ─── obstacles ────────────────────────────────────────────────────────────
  function getObstacles() {
    const obs = [];
    // protect the title area — body text must never reflow into these rows
    obs.push({ x: CL1, y: 0, w: CR1 - CL1, h: CT });
    shEls.forEach(el => {
      for (const o of shapeToObs(el)) obs.push(o);
    });
    for (const s of strokes) {
      for (const o of strokeToObs(s.pts)) obs.push(o);
    }
    // live preview: include in-progress stroke
    if (curPts && curPts.length > 1) {
      for (const o of strokeToObs(curPts)) obs.push(o);
    }
    return obs;
  }

  function segsForLine(y, L, R, obs) {
    const blocked = obs
      .filter(o => o.y < y + LH && o.y + o.h > y && o.x < R && o.x + o.w > L)
      .map(o => [Math.max(o.x, L), Math.min(o.x + o.w, R)])
      .sort((a, b) => a[0] - b[0]);

    const out = [];
    let cur = L;
    for (const [x1, x2] of blocked) {
      if (x1 > cur + 2) out.push([cur, x1]);
      cur = Math.max(cur, x2);
    }
    if (cur < R - 2) out.push([cur, R]);
    return out.filter(s => s[1] - s[0] > FS + 2);
  }

  // ─── render text ──────────────────────────────────────────────────────────
  function render() {
    const obs  = getObstacles();

    // expand canvas if text needs more room (clamped on mobile to prevent scroll)
    const needed = measureFullHeight(obs);
    const toolbarH2 = document.getElementById('toolbar').offsetHeight;
    const maxH = isMobile ? window.innerHeight - toolbarH2 : Infinity;
    const targetH = Math.min(needed, maxH);
    if (targetH > H) {
      H = targetH;
      wrap.style.height = H + 'px';
      setCanvasSize(tc, W, H);
      setCanvasSize(dc, W, H);
      tCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
      dCtx.setTransform(DPR, 0, 0, DPR, 0, 0);
      redrawStrokes();
    }

    tCtx.clearRect(0, 0, W, H);

    // draw title
    tCtx.font         = TITLE_FONT;
    tCtx.fillStyle    = 'rgba(218, 242, 252, 0.60)';
    tCtx.textBaseline = 'alphabetic';
    tCtx.fillText('jellyfish drift', CL1, isMobile ? 40 + 26 : 62 + 44);

    tCtx.font         = FONT;
    tCtx.fillStyle    = '#c8e8f4';
    tCtx.textBaseline = 'alphabetic';

    const cols = [[CL1, CR1]];
    let wi = 0;

    for (const [L, R] of cols) {
      let y = CT;

      while (wi < words.length) {
        const ss       = segsForLine(y, L, R, obs);
        const wiBefore = wi;

        for (const [sL, sR] of ss) {
          if (wi >= words.length) break;
          const sw = sR - sL;
          let lineW = 0;
          const lineStart = wi;

          // measure how many words fit
          while (wi < words.length) {
            const ww     = wW[wi];
            const needed = lineW === 0 ? ww : lineW + SPW + ww;
            if (needed > sw + 0.5) break;
            lineW = needed;
            wi++;
          }

          // draw centered
          const x0 = sL + (sw - lineW) / 2;
          let cx = x0;
          for (let i = lineStart; i < wi; i++) {
            tCtx.fillText(words[i], cx, y + FS + 5);
            cx += wW[i] + (i < wi - 1 ? SPW : 0);
          }
        }

        if (wi === wiBefore && wi < words.length && wW[wi] > R - L) wi++;
        y += LH;
      }

      if (wi >= words.length) break;
    }
  }

  // ─── swimming state for each draggable jellyfish ─────────────────────────
  // Jellyfish locomotion model:
  //   - Bell contracts every ~5 s (matching the SVG animation) → small upward
  //     impulse that decays exponentially (like a real pulse-glide cycle).
  //   - Between pulses the body slowly sinks back under gravity.
  //   - Horizontal drift is a very slow, low-amplitude sine — ocean current.
  // The result: rise on pulse → slow glide → gradual sink → pulse again.
  const BELL_PERIOD = 5000; // ms — must match the SVG animateTransform dur

  const swimmers = shEls.map((el, i) => {
    const svgEl = el.querySelector('svg');
    const elW = svgEl ? parseFloat(svgEl.getAttribute('width'))  || el.offsetWidth  : el.offsetWidth;
    const elH = svgEl ? parseFloat(svgEl.getAttribute('height')) || el.offsetHeight : el.offsetHeight;
    const r = el.getBoundingClientRect();
    const startX = r.left;
    const startY = r.top;
    return {
      el, elW, elH,
      // Current logical position (persisted between frames)
      x: startX,
      y: startY,
      prevX: startX,
      prevY: startY,
      // Vertical velocity (px/ms) — positive = downward
      vy: 0,
      // Horizontal velocity (px/ms)
      vx: 0,
      // Phase offset so jellies don't all pulse at once
      phaseOffset: i * (BELL_PERIOD / shEls.length) + Math.random() * 800,
      // 2D drift oscillators — horizontal and vertical, independent phases
      driftPhase:  Math.random() * Math.PI * 2,
      driftSpeed:  0.000110 + Math.random() * 0.000060,
      driftAmp:    window.innerWidth  * (0.45 + Math.random() * 0.25),
      vDriftPhase: Math.random() * Math.PI * 2,
      vDriftSpeed: 0.000075 + Math.random() * 0.000045, // slower vertical oscillation
      vDriftAmp:   window.innerHeight * (0.40 + Math.random() * 0.25), // tall vertical range
      isDragging: false,
    };
  });

  // Continuously update swimmer positions and re-render text
  let lastNow = null;

  function swimTick(now) {
    if (lastNow === null) lastNow = now;
    const dt = Math.min(now - lastNow, 64); // cap at ~2 frames to avoid jumps
    lastNow = now;

    let needsRender = false;

    swimmers.forEach(sw => {
      if (sw.isDragging) return;

      const maxW = window.innerWidth;
      const maxH = window.innerHeight;

      // ── 2D oscillator drift — horizontal and vertical ──────────────────
      const targetVx = Math.sin(now * sw.driftSpeed  + sw.driftPhase)  * sw.driftAmp  * sw.driftSpeed;
      const targetVy = Math.sin(now * sw.vDriftSpeed + sw.vDriftPhase) * sw.vDriftAmp * sw.vDriftSpeed;
      sw.vx += (targetVx - sw.vx) * 0.040;
      sw.vy += (targetVy - sw.vy) * 0.032; // slightly slower vertical response

      sw.x += sw.vx * dt;
      sw.y += sw.vy * dt;

      // ── Soft boundary bounce (full screen) ─────────────────────────────
      const margin = 20;
      if (sw.x < margin)                 { sw.x = margin;                 sw.vx =  Math.abs(sw.vx) * 0.4; }
      if (sw.x > maxW - sw.elW - margin) { sw.x = maxW - sw.elW - margin; sw.vx = -Math.abs(sw.vx) * 0.4; }
      if (sw.y < margin)                 { sw.y = margin;                 sw.vy =  Math.abs(sw.vy) * 0.3; }
      if (sw.y > maxH - sw.elH - margin) { sw.y = maxH - sw.elH - margin; sw.vy = -Math.abs(sw.vy) * 0.35; }

      const nx = Math.round(sw.x * 10) / 10;
      const ny = Math.round(sw.y * 10) / 10;

      if (Math.abs(nx - sw.prevX) > 0.5 || Math.abs(ny - sw.prevY) > 0.5) needsRender = true;
      sw.prevX = nx;
      sw.prevY = ny;

      sw.el.style.left = nx + 'px';
      sw.el.style.top  = ny + 'px';
    });

    if (needsRender) render();
    requestAnimationFrame(swimTick);
  }
  document.fonts.load('italic 300 42px "Cormorant Garamond"').then(() => {
    requestAnimationFrame(swimTick);
  });

  // ─── drag shapes ──────────────────────────────────────────────────────────
  let dragging = null, dox = 0, doy = 0;

  function startDrag(el, clientX, clientY) {
    dragging = el;
    const sw = swimmers.find(s => s.el === el);
    if (sw) sw.isDragging = true;
    // fixed-positioned elements: offset is relative to viewport
    dox = clientX - sw.x;
    doy = clientY - sw.y;
    el.classList.add('drag');
  }

  function moveDrag(clientX, clientY) {
    if (!dragging) return;
    const nx = clientX - dox;
    const ny = clientY - doy;
    dragging.style.left = nx + 'px';
    dragging.style.top  = ny + 'px';
    const sw = swimmers.find(s => s.el === dragging);
    if (sw) { sw.x = nx; sw.y = ny; }
    render();
  }

  function endDrag() {
    if (dragging) {
      dragging.classList.remove('drag');
      const sw = swimmers.find(s => s.el === dragging);
      if (sw) {
        sw.vx = 0;
        sw.vy = 0;
        sw.isDragging = false;
      }
      dragging = null;
    }
  }

  shEls.forEach(el => {
    el.querySelectorAll('.jbell, .jibell, .jarm, .jtent, .jelly-hit').forEach(path => {
      path.addEventListener('mousedown', e => {
        if (drawMode) return;
        startDrag(el, e.clientX, e.clientY);
        e.preventDefault();
      });
      path.addEventListener('touchstart', e => {
        if (drawMode) return;
        const t = e.touches[0];
        startDrag(el, t.clientX, t.clientY);
        e.preventDefault();
      }, { passive: false });
    });
  });

  document.addEventListener('mousemove', e => moveDrag(e.clientX, e.clientY));
  document.addEventListener('mouseup', endDrag);

  document.addEventListener('touchmove', e => {
    if (!dragging) return;
    moveDrag(e.touches[0].clientX, e.touches[0].clientY);
    e.preventDefault();
  }, { passive: false });
  document.addEventListener('touchend', endDrag);

  // ─── draw mode ────────────────────────────────────────────────────────────
  let drawMode     = false;
  let isDrawing    = false;
  let curPts       = null;
  let currentColor = '#A8C8E8';
  let renderTick   = 0;
  const strokes    = [];

  // color swatches
  document.querySelectorAll('.clr-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.clr-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentColor = btn.dataset.color;
    });
  });

  function drawSmoothPath(ctx, pts) {
    if (pts.length < 2) return;
    ctx.beginPath();
    ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const mx = (pts[i][0] + pts[i + 1][0]) / 2;
      const my = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], mx, my);
    }
    const last = pts.length - 1;
    ctx.lineTo(pts[last][0], pts[last][1]);
    ctx.stroke();
  }

  function applyGlow(ctx, color) {
    ctx.shadowColor   = color;
    ctx.shadowBlur    = 18;
  }

  function clearGlow(ctx) {
    ctx.shadowColor = 'transparent';
    ctx.shadowBlur  = 0;
  }

  function redrawStrokes() {
    dCtx.clearRect(0, 0, W, H);
    dCtx.lineWidth = 1.5;
    dCtx.lineCap   = 'round';
    dCtx.lineJoin  = 'round';
    for (const s of strokes) {
      if (s.pts.length < 2) continue;
      dCtx.strokeStyle = s.color;
      applyGlow(dCtx, s.color);
      drawSmoothPath(dCtx, s.pts);
      // second pass at lower opacity for a softer outer halo
      dCtx.globalAlpha = 0.35;
      dCtx.lineWidth   = 3.5;
      dCtx.shadowBlur  = 32;
      drawSmoothPath(dCtx, s.pts);
      dCtx.globalAlpha = 1;
      dCtx.lineWidth   = 1.5;
      clearGlow(dCtx);
    }
  }

  document.getElementById('btn-draw-toggle').addEventListener('click', () => {
    drawMode = !drawMode;
    document.getElementById('btn-draw-toggle').classList.toggle('active', drawMode);
    dc.classList.toggle('draw', drawMode);
    document.getElementById('draw-toolbar').classList.toggle('visible', drawMode);
    document.body.classList.toggle('draw-open', drawMode);
    document.getElementById('hint').textContent = drawMode
      ? 'click & drag to draw — stroke becomes a text obstacle'
      : 'drag shapes · draw strokes · watch text reflow';
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    strokes.length = 0;
    dCtx.clearRect(0, 0, W, H);
    render();
  });

  function cxy(clientX, clientY) {
    const r  = dc.getBoundingClientRect();
    const sx = W / r.width;
    const sy = H / r.height;
    return [(clientX - r.left) * sx, (clientY - r.top) * sy];
  }

  function drawStart(clientX, clientY) {
    isDrawing = true;
    const [x, y] = cxy(clientX, clientY);
    curPts  = [[x, y]];
    dCtx.lineWidth = 1.5;
    dCtx.lineCap   = 'round';
    dCtx.lineJoin  = 'round';
  }

  function drawMove(clientX, clientY) {
    if (!isDrawing) return;
    const [x, y] = cxy(clientX, clientY);
    curPts.push([x, y]);
    // redraw current stroke smoothly from scratch each move
    redrawStrokes();
    dCtx.strokeStyle = currentColor;
    applyGlow(dCtx, currentColor);
    drawSmoothPath(dCtx, curPts);
    dCtx.globalAlpha = 0.35;
    dCtx.lineWidth   = 3.5;
    dCtx.shadowBlur  = 32;
    drawSmoothPath(dCtx, curPts);
    dCtx.globalAlpha = 1;
    dCtx.lineWidth   = 1.5;
    clearGlow(dCtx);
    renderTick++;
    if (renderTick % 4 === 0) render();
  }

  function drawEnd() {
    if (!isDrawing) return;
    isDrawing = false;
    if (curPts && curPts.length > 1) {
      strokes.push({ pts: curPts, color: currentColor });
      render();
    }
    curPts = null;
  }

  dc.addEventListener('mousedown', e => {
    if (!drawMode) return;
    drawStart(e.clientX, e.clientY);
    e.preventDefault();
  });

  dc.addEventListener('mousemove', e => {
    if (!drawMode) return;
    drawMove(e.clientX, e.clientY);
  });

  dc.addEventListener('mouseup', () => { if (drawMode) drawEnd(); });

  dc.addEventListener('mouseleave', () => {
    if (drawMode && isDrawing) drawEnd();
  });

  dc.addEventListener('touchstart', e => {
    if (!drawMode) return;
    const t = e.touches[0];
    drawStart(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  dc.addEventListener('touchmove', e => {
    if (!drawMode) return;
    const t = e.touches[0];
    drawMove(t.clientX, t.clientY);
    e.preventDefault();
  }, { passive: false });

  dc.addEventListener('touchend', () => { if (drawMode) drawEnd(); });

  // ─── init ─────────────────────────────────────────────────────────────────
  window.addEventListener('resize', resize);
  resize();

  // ─── mobile: spread draggable jellyfish across the full viewport ───────────
  if (isMobile) {
    const vw = window.innerWidth;
    const vh = window.innerHeight;
    const jellyW = 99;  // scaled CSS width (180 * 0.55)
    const jellyH = 198; // scaled CSS height (360 * 0.55)
    // Divide viewport into vertical zones so each jellyfish occupies its own strip
    const mobilePositions = [
      { left: vw * 0.05,              top: vh * 0.04 },
      { left: vw * 0.55,              top: vh * 0.18 },
      { left: vw * 0.10,              top: vh * 0.38 },
      { left: vw * 0.52,              top: vh * 0.55 },
      { left: vw * 0.15,              top: vh * 0.72 },
    ];
    shEls.forEach((el, i) => {
      const pos = mobilePositions[i] || mobilePositions[0];
      // Clamp so jellyfish don't exceed screen bounds
      const x = Math.min(Math.max(pos.left, 0), vw - jellyW);
      const y = Math.min(Math.max(pos.top,  0), vh - jellyH);
      el.style.left = x + 'px';
      el.style.top  = y + 'px';
    });
    // Update swimmer records to match new positions and scaled dimensions
    swimmers.forEach((sw, i) => {
      const pos = mobilePositions[i] || mobilePositions[0];
      sw.x = sw.prevX = Math.min(Math.max(pos.left, 0), vw - jellyW);
      sw.y = sw.prevY = Math.min(Math.max(pos.top,  0), vh - jellyH);
      sw.elW = jellyW;
      sw.elH = jellyH;
    });
  }

  // ─── ambient drifting jellyfish ───────────────────────────────────────────
  // Uses the exact same SVG as the draggable instances, scaled down, drifting
  // softly across the page with JS-driven position steps + CSS fade animation.
  (function spawnJellies() {
    const layer = document.getElementById('jelly-layer');
    let uid = 0;

    // The inner SVG content (without outer <svg> tag) — exact lottie paths.
    // IDs will be made unique per instance via uid.
    const INNER_TEMPLATE = document.getElementById('sh-jelly-a').querySelector('svg').innerHTML;

    function rnd(a, b) { return a + Math.random() * (b - a); }

    function easeInOut(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    function spawnOne() {
      uid++;
      const id  = `aj${uid}`;
      const el  = document.createElement('div');
      el.className = 'jelly';

      // Size: scale the 360×720 viewBox to a random display size
      const mobile = window.innerWidth <= 480;
      const w = mobile ? rnd(28, 65) : rnd(60, 160);
      const h = w * 2; // 360:720 = 1:2

      // Random start position — full viewport including sides
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const startX = rnd(-w * 0.3, vw - w * 0.7);
      const startY = rnd(vh * 0.05, vh * 0.95);

      // Build waypoints: upward drift + wider lateral sway across full screen
      const steps = 8;
      const totalDur = rnd(mobile ? 9 : 14, mobile ? 18 : 28) * 1000; // ms — fluid drift speed
      const waypoints = [];
      let cx = startX, cy = startY;
      for (let s = 0; s <= steps; s++) {
        waypoints.push({ x: cx, y: cy });
        cx += rnd(mobile ? -90 : -160, mobile ? 90 : 160); // lateral sweep
        cy -= rnd(mobile ? 25 : 40, mobile ? 80 : 140); // drift upward
      }

      const maxOp = mobile ? rnd(0.14, 0.32) : rnd(0.06, 0.18);

      // Build SVG with unique IDs
      const svgInner = INNER_TEMPLATE.replace(/\bid="([^"]+)"/g, (_, old) => `id="${id}-${old}"`);
      el.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 360 720">${svgInner}</svg>`;

      el.style.cssText = `left:${startX}px;top:${startY}px;opacity:0;--max-opacity:${maxOp};animation:jellyFade ${totalDur}ms linear forwards;`;
      layer.appendChild(el);

      // Animate position along waypoints using JS
      let stepIdx = 0;
      const stepDur = totalDur / steps;

      function moveToNext() {
        if (stepIdx >= steps) {
          el.remove();
          setTimeout(spawnOne, rnd(1500, 5000));
          return;
        }
        const from = waypoints[stepIdx];
        const to   = waypoints[stepIdx + 1];
        const start = performance.now();
        stepIdx++;

        function tick(now) {
          const t = Math.min((now - start) / stepDur, 1);
          const e = easeInOut(t);
          el.style.left = (from.x + (to.x - from.x) * e) + 'px';
          el.style.top  = (from.y + (to.y - from.y) * e) + 'px';
          if (t < 1) requestAnimationFrame(tick);
          else moveToNext();
        }
        requestAnimationFrame(tick);
      }

      moveToNext();
    }

    // Seed with staggered starts — more ambient jellyfish
    for (let i = 0; i < 10; i++) {
      setTimeout(spawnOne, i * rnd(300, 1800));
    }
  })();

  // ─── tentacle wave animation ───────────────────────────────────────────────
  // Drives a travelling sinusoidal wave down every .jtent path so tentacles
  // undulate like a real jellyfish instead of swinging as a rigid body.
  (function tentacleWaves() {
    // Per-tentacle config read from its data attributes or id — we derive
    // everything from the path's current (static) start point and length.

    // Samples N points along a straight vertical line from (x0,y0) to (x0,y1),
    // displaces each horizontally by a travelling sine wave, and returns an
    // SVG polyline-style path string using quadratic Bézier smoothing.
    function wavePath(x0, y0, length, segments, amp, freq, speed, phase, t) {
      const pts = [];
      for (let i = 0; i <= segments; i++) {
        const frac = i / segments;
        const y = y0 + length * frac;
        // Wave: amplitude grows toward the tip (quadratic envelope)
        const envelope = frac * frac;
        const x = x0 + Math.sin(freq * frac * Math.PI * 2 - speed * t + phase) * amp * envelope;
        pts.push([x, y]);
      }
      // Smooth with quadratic Bézier between midpoints
      let d = `M${pts[0][0].toFixed(2)},${pts[0][1].toFixed(2)}`;
      for (let i = 1; i < pts.length - 1; i++) {
        const mx = (pts[i][0] + pts[i + 1][0]) / 2;
        const my = (pts[i][1] + pts[i + 1][1]) / 2;
        d += ` Q${pts[i][0].toFixed(2)},${pts[i][1].toFixed(2)} ${mx.toFixed(2)},${my.toFixed(2)}`;
      }
      const last = pts[pts.length - 1];
      d += ` L${last[0].toFixed(2)},${last[1].toFixed(2)}`;
      return d;
    }

    // Extract rest-position data from a tentacle path element.
    // Reads <animate values> first keyframe (or static d), then removes the
    // SMIL animation so JS owns the attribute going forward.
    // Returns { x0, y0, length } or null if unparseable.
    function tentacleBase(el) {
      let baseD = el.getAttribute('d') || '';
      const animEl = el.querySelector('animate[attributeName="d"]');
      if (animEl) {
        const vals = animEl.getAttribute('values') || '';
        const first = vals.split(';')[0].trim();
        if (first) baseD = first;
        animEl.remove();
      }
      // Also remove any leftover <animate> children to be safe
      el.querySelectorAll('animate').forEach(a => a.remove());

      const mMatch = baseD.match(/M\s*([\d.]+)[,\s]([\d.]+)/);
      if (!mMatch) return null;
      const x0 = parseFloat(mMatch[1]);
      const y0 = parseFloat(mMatch[2]);
      const allL = [...baseD.matchAll(/L\s*([\d.]+)[,\s]([\d.]+)/g)];
      const yEnd = allL.length ? parseFloat(allL[allL.length - 1][2]) : y0 + 414;
      return { x0, y0, length: yEnd - y0 };
    }

    // Snapshot the rest positions from the template jellyfish *before* we strip
    // their animations. Ambient clones will have no <animate> children, so we
    // embed the base coords as data attributes on each path for later reading.
    const templateSVG = document.querySelector('#sh-jelly-a svg');
    const templateBases = [];
    if (templateSVG) {
      templateSVG.querySelectorAll('path.jtent').forEach((el, i) => {
        const b = tentacleBase(el);
        if (b) {
          templateBases[i] = b;
          el.dataset.twx = b.x0;
          el.dataset.twy = b.y0;
          el.dataset.twl = b.length;
        }
      });
    }

    // Register a single tentacle element into the live list.
    function registerTentacle(el, idx) {
      // Already registered?
      if (el._twRegistered) return;
      el._twRegistered = true;

      let x0, y0, length;
      if (el.dataset.twx !== undefined) {
        // Cloned ambient jelly — base coords stamped at clone time
        x0     = parseFloat(el.dataset.twx);
        y0     = parseFloat(el.dataset.twy);
        length = parseFloat(el.dataset.twl);
      } else {
        const b = tentacleBase(el);
        if (!b) return;
        ({ x0, y0, length } = b);
      }

      tentacles.push({
        el,
        x0, y0, length,
        amp:   9 + (idx % 5) * 2.5,
        freq:  1.6 + (idx % 3) * 0.3,
        speed: 2.8 + (idx % 4) * 0.35,
        phase: (idx / 12) * Math.PI * 2,
        segs:  12,
      });
    }

    let tentacles = [];

    // Initial collect from draggable jellyfish (template already processed above)
    document.querySelectorAll('.sh svg').forEach(svg => {
      svg.querySelectorAll('path.jtent').forEach((el, idx) => registerTentacle(el, idx));
    });

    // Stamp base coords onto ambient clones so registerTentacle can read them.
    // Patch spawnOne to add data attrs after the innerHTML is built.
    // We do this via MutationObserver watching jelly-layer children.
    const jellyLayer = document.getElementById('jelly-layer');
    if (jellyLayer) {
      new MutationObserver(mutations => {
        mutations.forEach(m => {
          m.addedNodes.forEach(node => {
            if (node.nodeType !== 1) return;
            node.querySelectorAll('path.jtent').forEach((el, idx) => {
              // Stamp from template bases by position index
              const b = templateBases[idx];
              if (b) {
                el.dataset.twx = b.x0;
                el.dataset.twy = b.y0;
                el.dataset.twl = b.length;
              }
              // Remove any stale <animate> (template innerHTML already stripped them)
              el.querySelectorAll('animate').forEach(a => a.remove());
              registerTentacle(el, idx);
            });
          });
          m.removedNodes.forEach(node => {
            if (node.nodeType !== 1) return;
            node.querySelectorAll('path.jtent').forEach(el => {
              const i = tentacles.findIndex(t => t.el === el);
              if (i !== -1) tentacles.splice(i, 1);
            });
          });
        });
      }).observe(jellyLayer, { childList: true });
    }

    function frame(now) {
      const t = now * 0.001; // seconds
      for (const tent of tentacles) {
        tent.el.setAttribute('d', wavePath(
          tent.x0, tent.y0, tent.length,
          tent.segs, tent.amp, tent.freq, tent.speed, tent.phase, t
        ));
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

})();

// Ocean sound
(function () {
  let ctx = null, masterGain = null, playing = false;
  let pluckTimer = null;

  function buildOcean() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();

    // Master lowpass — deep underwater muffling
    const lpf = ctx.createBiquadFilter();
    lpf.type = 'lowpass';
    lpf.frequency.value = 1400;
    lpf.Q.value = 0.5;

    // Reverb via convolver — simulate large underwater space
    const convolver = ctx.createConvolver();
    const irLen = ctx.sampleRate * 4;
    const irBuf = ctx.createBuffer(2, irLen, ctx.sampleRate);
    for (let ch = 0; ch < 2; ch++) {
      const d = irBuf.getChannelData(ch);
      for (let i = 0; i < irLen; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / irLen, 2.8);
    }
    convolver.buffer = irBuf;
    const reverbGain = ctx.createGain();
    reverbGain.gain.value = 0.38;

    masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0, ctx.currentTime);

    lpf.connect(convolver);
    convolver.connect(reverbGain);
    reverbGain.connect(masterGain);
    lpf.connect(masterGain);
    masterGain.connect(ctx.destination);

    // ── Very soft distant hum — barely-there subsonic presence ────────────
    // Not waves, just the deep ocean's own resonance
    [36.7, 55, 73.4].forEach((hz, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = hz;

      // Imperceptibly slow pitch wander
      const wander = ctx.createOscillator();
      wander.type = 'sine';
      wander.frequency.value = 0.007 + i * 0.004;
      const wanderGain = ctx.createGain();
      wanderGain.gain.value = hz * 0.006;
      wander.connect(wanderGain);
      wanderGain.connect(osc.frequency);
      wander.start();

      const g = ctx.createGain();
      g.gain.value = [0.10, 0.055, 0.03][i];
      osc.connect(g);
      g.connect(lpf);
      osc.start();
    });

    // ── Slow breathing pads — calm Fm-like tones, very long cycle ─────────
    // C minor pentatonic in low register: C3 Eb3 F3 G3 Bb3
    const padFreqs = [130.8, 155.6, 174.6, 196.0, 233.1];
    padFreqs.forEach((hz, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = hz;

      // Each pad breathes on its own very slow cycle — no synchrony
      const breathLfo = ctx.createOscillator();
      breathLfo.type = 'sine';
      breathLfo.frequency.value = 0.018 + i * 0.007;
      const breathGain = ctx.createGain();
      breathGain.gain.value = 0.028;
      const breathBias = ctx.createGain();
      breathBias.gain.value = 0.030;
      breathLfo.connect(breathGain);
      breathGain.connect(breathBias.gain);
      breathLfo.start();

      // Very slow pitch float — like sound refracted through deep water
      const pitchLfo = ctx.createOscillator();
      pitchLfo.type = 'sine';
      pitchLfo.frequency.value = 0.011 + i * 0.009;
      const pitchLfoGain = ctx.createGain();
      pitchLfoGain.gain.value = hz * 0.003;
      pitchLfo.connect(pitchLfoGain);
      pitchLfoGain.connect(osc.frequency);
      pitchLfo.start();

      osc.connect(breathBias);
      breathBias.connect(lpf);
      osc.start();
    });

    // ── Upper harmonic shimmer — very quiet, airy, bioluminescent feel ────
    const shimmerFreqs = [392.0, 523.25, 659.25, 783.99];
    shimmerFreqs.forEach((hz, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = hz;

      const ampLfo = ctx.createOscillator();
      ampLfo.type = 'sine';
      ampLfo.frequency.value = 0.025 + i * 0.013;
      const ampLfoGain = ctx.createGain();
      ampLfoGain.gain.value = 0.010;
      const ampBias = ctx.createGain();
      ampBias.gain.value = 0.012;
      ampLfo.connect(ampLfoGain);
      ampLfoGain.connect(ampBias.gain);
      ampLfo.start();

      osc.connect(ampBias);
      ampBias.connect(lpf);
      osc.start();
    });
  }

  // ── Soft water-drop pluck — gentle sporadic accent ─────────────────────
  // Uses a short sine burst with fast attack / long exponential decay
  function pingPluck() {
    if (!ctx || !playing) return;
    const t = ctx.currentTime;
    // Pentatonic tones: C4 Eb4 F4 G4 Bb4
    const notes = [261.63, 311.13, 349.23, 392.0, 466.16];
    const baseFreq = notes[Math.floor(Math.random() * notes.length)];

    // Fundamental + one soft octave partial
    [baseFreq, baseFreq * 2].forEach((freq, i) => {
      const osc = ctx.createOscillator();
      osc.type = 'sine';
      osc.frequency.value = freq;

      const env = ctx.createGain();
      env.gain.setValueAtTime(0, t);
      env.gain.linearRampToValueAtTime(0.040 / (i + 1), t + 0.003);
      env.gain.exponentialRampToValueAtTime(0.0001, t + 4.5 - i * 0.5);

      osc.connect(env);
      env.connect(masterGain);
      osc.start(t);
      osc.stop(t + 5.0);
    });

    // Next pluck — slow and irregular, 12–30 seconds
    const delay = 12000 + Math.random() * 18000;
    pluckTimer = setTimeout(pingPluck, delay);
  }

  function fadeIn() {
    masterGain.gain.cancelScheduledValues(ctx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0.72, ctx.currentTime + 4.0);
    // First pluck after a moment of ambient settling
    pluckTimer = setTimeout(pingPluck, 6000 + Math.random() * 6000);
  }

  function fadeOut(cb) {
    masterGain.gain.cancelScheduledValues(ctx.currentTime);
    masterGain.gain.setValueAtTime(masterGain.gain.value, ctx.currentTime);
    masterGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 1.8);
    clearTimeout(pluckTimer);
    setTimeout(cb, 1900);
  }

  const btn = document.getElementById('btn-sound');

  const iconMuted = `<svg id="icon-sound" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><line x1="23" y1="9" x2="17" y2="15"></line><line x1="17" y1="9" x2="23" y2="15"></line></svg>`;
  const iconOn = `<svg id="icon-sound" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon><path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path><path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path></svg>`;

  btn.addEventListener('click', () => {
    if (!playing) {
      if (!ctx) buildOcean();
      if (ctx.state === 'suspended') ctx.resume();
      fadeIn();
      playing = true;
      btn.innerHTML = iconOn + ' Sound';
      btn.classList.add('active');
    } else {
      fadeOut(() => {
        if (ctx) ctx.suspend();
      });
      playing = false;
      btn.innerHTML = iconMuted + ' Sound';
      btn.classList.remove('active');
    }
  });
})();
